<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
  Read-only, syntax-highlighted user-script source viewer.

  Loaded as a chrome document inside a browser tab via
    chrome://greasemonkey/content/sourceViewer.xhtml?path=<encoded OS path>

  XHTML (not XUL) so CodeMirror's document.createElement() calls produce HTML
  elements and it can render.  All visible text is set at runtime from
  sourceViewer/*.js (with English fallbacks), so this file needs no DTD.

  The first stylesheet is the browser's own CodeMirror structural CSS (same
  chrome path on Pale Moon 35 and Basilisk); sourceViewer.css layers the
  light/dark colours on top.
-->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <title>User Script Source</title>
  <link rel="stylesheet" type="text/css"
    href="chrome://devtools/content/sourceeditor/codemirror/lib/codemirror.css"/>
  <link rel="stylesheet" type="text/css"
    href="chrome://greasemonkey/skin/sourceViewer.css"/>
  <script type="application/javascript"
    src="chrome://greasemonkey/content/sourceViewer/theme.js"></script>
  <script type="application/javascript"
    src="chrome://greasemonkey/content/sourceViewer/scrollbars.js"></script>
  <script type="application/javascript"
    src="chrome://greasemonkey/content/sourceViewer/meta.js"></script>
  <script type="application/javascript"
    src="chrome://greasemonkey/content/sourceViewer/viewer.js"></script>
</head>
<body class="theme-light">
  <!-- Toolbar: the script's name and version, the address it came from,
       Metadata (shows/hides the header below), Find, and the Auto / Light /
       Dark switch. -->
  <div id="gm-sv-toolbar">
    <span id="gm-sv-name"></span>
    <span id="gm-sv-version"></span>
    <span id="gm-sv-source"></span>
    <button id="gm-sv-meta-toggle" type="button" hidden="hidden"
      aria-pressed="false"></button>
    <button id="gm-sv-find-open" type="button" hidden="hidden"></button>
    <span id="gm-sv-theme" role="group">
      <button type="button" data-mode="auto" aria-pressed="false"></button>
      <button type="button" data-mode="light" aria-pressed="false"></button>
      <button type="button" data-mode="dark" aria-pressed="false"></button>
    </span>
  </div>

  <!-- What the script declares (meta.js); only for a file with a metadata
       block. -->
  <div id="gm-sv-meta" hidden="hidden"></div>

  <div id="gm-sv-main">
    <!-- CodeMirror (or the textarea fallback) is mounted into this div. -->
    <div id="gm-sv-host"></div>

    <!-- Find bar (overlay, top-right of the code).  Opened with Ctrl+F or
         the toolbar's Find button when CodeMirror is active; viewer.js
         searches the full document model and drives the selection
         (CodeMirror virtualises its DOM, so the browser's native find can't
         see off-screen lines).  The placeholder text is set at runtime. -->
    <div id="gm-sv-find" hidden="hidden">
      <input id="gm-sv-find-input" type="text"/>
      <span id="gm-sv-find-count"></span>
      <button id="gm-sv-find-prev" type="button" title="Previous">&#x25B2;</button>
      <button id="gm-sv-find-next" type="button" title="Next">&#x25BC;</button>
      <button id="gm-sv-find-close" type="button" title="Close">&#x2715;</button>
    </div>
  </div>

  <!-- Thin status strip; hidden until there is a note to show ("plain
       text", a read error). -->
  <div id="gm-sv-status" hidden="hidden">
    <span id="gm-sv-note"></span>
  </div>
</body>
</html>
